variables:
  RELEASE_VERSION: "1.0.0"

stages:
  - build

image: node:22

build_extension:
  stage: build
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.rnd.mendix.com/innovation-incubation/agent-editor.git temp_repo
    - cd temp_repo/agent-editor
    - npm ci
    - npm run build
    - cd ../..
    - rm -rf extensions/agent-editor/*
    - echo "Contents before copying:"
    - ls -la extensions/agent-editor/
    - cp -r temp_repo/agent-editor/dist/agents-studio-pro/* extensions/agent-editor/
    - echo "Contents after copying:"
    - ls -la extensions/agent-editor/
    - rm -rf temp_repo
  artifacts:
    paths:
      - extensions/agent-editor/  # Adjust based on your build output directory
    expire_in: 1 hour

