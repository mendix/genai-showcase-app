variables:
  RELEASE_VERSION: "1.0.0"

stages:
  - build

build_extension:
  stage: build
  image: nexus-docker-group.rnd.mendix.com/node:22
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.rnd.mendix.com/innovation-incubation/agent-editor.git temp_repo
    - cd temp_repo/agent-editor
    - npm ci
    - npm run build
    - cd ../..
    - rm -rf extensions/agent-editor/*
    - cp -r temp_repo/agent-editor/dist/agents-studio-pro/* extensions/agent-editor/
    - rm -rf temp_repo
  artifacts:
    paths:
      - extensions/agent-editor/
    expire_in: 1 hour

build_package:
  stage: build
  #needs: [build_extension]
  image: nexus-docker-group.rnd.mendix.com/mxbuild:11.7.0
  script:
    - mx check
    - mx build