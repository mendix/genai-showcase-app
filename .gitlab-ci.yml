variables:
  MODULE_NAME: "AgentEditorCommons"
  ADDON_NAME: "AgentEditor"
  MPR_FILE: "GenAI Showcase App.mpr"
  INITIAL_MX_VERSION: "11.7.0"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /-\d+\.\d+\.\d+$/'

stages:
  - prepare
  - test
  - build
  - validate
  - package

extract_release_version:
  stage: prepare
  image: alpine:latest
  script:
    - VERSION=$(echo "$CI_COMMIT_TAG" | sed -n 's/.*-\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p')
    - |
      if [ -n "$VERSION" ]; then
        echo "RELEASE_VERSION=$VERSION" >> version.env
        echo "Extracted release version: $VERSION"
      else
        echo "No valid version tag found"
        exit 1
      fi
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 1 hour

clone_extension:
  stage: prepare
  needs: [extract_release_version]
  image: nexus-docker-group.rnd.mendix.com/node:22
  script:
    - rm -rf temp_repo
    - git clone --depth=1 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.rnd.mendix.com/innovation-incubation/agent-editor.git temp_repo
  artifacts:
    paths:
      - temp_repo/
    expire_in: 1 hour

get_mx_version:
  stage: prepare
  needs: [extract_release_version]
  image: nexus-docker-group.rnd.mendix.com/mxbuild:${INITIAL_MX_VERSION}
  script:
    - MX_VERSION=$(mx show-version "$MPR_FILE")
    - echo "MX_VERSION=$MX_VERSION" >> variables.env
    - echo "Mendix version is $MX_VERSION"
  artifacts:
    reports:
      dotenv: variables.env
    expire_in: 1 hour

test_extension:
  stage: test
  needs: [clone_extension, extract_release_version]
  image: nexus-docker-group.rnd.mendix.com/node:22
  script:
    - cd temp_repo/agent-editor
    - npm ci
    - npm run test

build_extension:
  stage: build
  needs: [clone_extension, test_extension, extract_release_version]
  image: nexus-docker-group.rnd.mendix.com/node:22
  script:
    - cd temp_repo/agent-editor
    - npm ci
    - npm run build
    - cd ../..
    - rm -rf extensions/agent-editor/*
    - cp -r temp_repo/agent-editor/dist/agents-studio-pro/* extensions/agent-editor/
    - rm -rf temp_repo
  artifacts:
    paths:
      - extensions/agent-editor/
    expire_in: 1 hour

mx_check:
  stage: validate
  needs: [build_extension, get_mx_version, extract_release_version]
  image: nexus-docker-group.rnd.mendix.com/mxbuild:${MX_VERSION}
  script:
    - mx check "$MPR_FILE" && EXIT_CODE=0 || EXIT_CODE=$?
    - echo "Exit code $EXIT_CODE"
    - |
      if [ "$EXIT_CODE" -eq 1 ]; then
        echo "Build failed - Project contains errors"
        exit 1
      fi
    - echo "Check completed (warnings/deprecations may exist but no errors)"

create_module_package:
  stage: package
  needs: [build_extension, mx_check, get_mx_version, extract_release_version]
  image: nexus-docker-group.rnd.mendix.com/mxbuild:${MX_VERSION}
  script:
    - mkdir -p output
    - mx create-module-package -e "(resources|userlib|widgets)/*" -d output "$MPR_FILE" $MODULE_NAME
    - ls -la output/
  artifacts:
    paths:
      - output/$MODULE_NAME.mpk
    expire_in: 1 hour

create_addon_package:
  stage: package
  needs: [build_extension, mx_check, get_mx_version, extract_release_version]
  image: nexus-docker-group.rnd.mendix.com/mxbuild:${MX_VERSION}
  script:
    - mkdir -p output
    - echo "Setting module version..."
    - mx set-module-version "$MPR_FILE" $ADDON_NAME $RELEASE_VERSION
    - echo "Creating solution package..."
    - mx create-module-package -e "(resources|userlib|widgets)/*" -d output "$MPR_FILE" $ADDON_NAME
    - ls -la output/
  artifacts:
    paths:
      - output/$ADDON_NAME.mxmodule
    expire_in: 1 hour

package_for_release:
  stage: package
  needs: [create_module_package, create_addon_package, extract_release_version]
  image: alpine:latest
  before_script:
    - apk add --no-cache p7zip bash
  script:
    - cd output
    - echo "Unpacking mpk..."
    - mv $MODULE_NAME.mpk $MODULE_NAME.zip
    - unzip -q $MODULE_NAME.zip -d temp
    - echo "Adding add-on to package.xml..."
    - |
      sed -i "/<\/files>/i\    <file path=\"modules/$ADDON_NAME\" />" temp/package.xml
    - echo "Adding add-on module to package..."
    - mkdir -p temp/modules
    - cp $ADDON_NAME.mxmodule temp/modules/
    - echo "Repacking mpk..."
    - cd temp
    - 7z a -tzip ../$MODULE_NAME.zip * -mx0
    - cd ..
    - mv $MODULE_NAME.zip $MODULE_NAME.mpk
    - rm -rf temp $ADDON_NAME.mxmodule
    - mv $MODULE_NAME.mpk ${MODULE_NAME}_${RELEASE_VERSION}.mpk
    - echo "Final package is available in artifacts as ${MODULE_NAME}_${RELEASE_VERSION}.mpk"
  artifacts:
    paths:
      - output/${MODULE_NAME}_${RELEASE_VERSION}.mpk
    expire_in: 1 week

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - temp_repo/agent-editor/node_modules/